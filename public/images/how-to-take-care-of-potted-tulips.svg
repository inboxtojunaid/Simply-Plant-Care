    <path d="M480 320 C440 300 428 250 448 210 C458 232 470 240 480 226 C490 240 502 232 512 210 C532 250 520 300 480 320 Z" fill="#E86A8A"/>
    <path d="M480 320 C462 300 458 262 466 228 C472 250 476 268 480 280 C484 268 488 250 494 228 C502 262 498 300 480 320 Z" fill="#F194A8"/>
    <!-- centre-left yellow -->
    <path d="M560 290 C520 270 508 220 528 180 C538 202 550 210 560 196 C570 210 582 202 592 180 C612 220 600 270 560 290 Z" fill="#F2C230"/>
    <path d="M560 290 C542 270 538 232 546 198 C552 220 556 238 560 250 C564 238 568 220 574 198 C582 232 578 270 560 290 Z" fill="#F7D95C"/>
    <!-- centre-right pink -->
    <path d="M640 290 C600 270 588 220 608 180 C618 202 630 210 640 196 C650 210 662 202 672 180 C692 220 680 270 640 290 Z" fill="#E86A8A"/>
    <path d="M640 290 C622 270 618 232 626 198 C632 220 636 238 640 250 C644 238 648 220 654 198 C662 232 658 270 640 290 Z" fill="#F194A8"/>
