<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Illustration of pink and yellow potted tulips in bloom">
  <rect width="1200" height="800" fill="#FAF7F0"/>
  <circle cx="600" cy="400" r="330" fill="#F3EDE2"/>
  <ellipse cx="600" cy="700" rx="420" ry="44" fill="#E8DFCE"/>
  <!-- pot -->
  <g>
    <path d="M420 560 L780 560 L750 720 Q600 742 450 720 Z" fill="#D9A441"/>
    <rect x="404" y="532" width="392" height="36" rx="10" fill="#C08A2E"/>
