<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Illustration of shade-tolerant plants in a dim room with soft light from a small window">
<rect width="1200" height="800" fill="#FAF7F0"/>
<rect x="820" y="90" width="260" height="340" rx="10" fill="#DCE8DD" stroke="#1E4D3A" stroke-width="10"/>
<line x1="950" y1="90" x2="950" y2="430" stroke="#1E4D3A" stroke-width="8"/>
<line x1="820" y1="260" x2="1080" y2="260" stroke="#1E4D3A" stroke-width="8"/>
<polygon points="950,90 1080,430 820,430" fill="#F2E9C9" opacity="0.55"/>
<rect x="90" y="600" width="1020" height="20" rx="6" fill="#C9B18C"/>
<!-- Snake plant in shade -->
<g>
<path d="M220 600 L230 440 L270 450 L265 600 Z" fill="#2E6B4F"/>
<path d="M270 600 L285 400 L325 415 L320 600 Z" fill="#3E8A63"/>
<path d="M320 600 L335 460 L375 470 L370 600 Z" fill="#245741"/>
<rect x="200" y="600" width="190" height="95" rx="12" fill="#C96F4A"/>
</g>
<!-- ZZ plant -->
<g>
<path d="M540 600 L560 430 L580 600 Z" fill="#2E6B4F"/>
<path d="M590 600 L610 410 L630 600 Z" fill="#3E8A63"/>
<ellipse cx="555" cy="470" rx="44" ry="18" fill="#245741" transform="rotate(-30 555 470)"/>
<ellipse cx="615" cy="450" rx="44" ry="18" fill="#4A9A6E" transform="rotate(30 615 450)"/>
<ellipse cx="570" cy="520" rx="42" ry="17" fill="#3E8A63" transform="rotate(-25 570 520)"/>
<rect x="520" y="600" width="170" height="95" rx="12" fill="#1E4D3A"/>
</g>
<!-- Pothos -->
<g>
<ellipse cx="760" cy="520" rx="40" ry="26" fill="#2E6B4F" transform="rotate(-20 760 520)"/>
<ellipse cx="820" cy="560" rx="40" ry="26" fill="#4A9A6E" transform="rotate(20 820 560)"/>
<ellipse cx="730" cy="570" rx="36" ry="24" fill="#3E8A63" transform="rotate(-15 730 570)"/>
<path d="M760 600 C740 540 800 520 790 470" fill="none" stroke="#3E8A63" stroke-width="10" stroke-linecap="round"/>
<rect x="700" y="600" width="170" height="95" rx="12" fill="#8AA899"/>
</g>
<text x="600" y="750" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#1E4D3A">Shade-tolerant plants in soft, indirect light</text>
</svg>
